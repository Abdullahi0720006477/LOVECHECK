<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            "primary-fixed-dim": "#ffb1c3",
            "on-secondary": "#490080",
            "on-primary": "#66002d",
            "surface-bright": "#3c3741",
            "surface-container-high": "#2c2831",
            "on-secondary-fixed-variant": "#6900b3",

            "inverse-surface": "#e8e0ec",

            "on-surface": "#e8e0ec",
            "surface-variant": "#37333c",
            "tertiary-container": "#d0a61e",
            "tertiary": "#eec13c",
            "on-background": "#e8e0ec",

            "on-error": "#690005",

            "on-tertiary-container": "#4f3d00",
            "surface-container-lowest": "#100d15",
            "on-tertiary-fixed": "#241a00",
            "background": "#15121a",
            "surface-dim": "#15121a",
            "outline": "#a8898f",
            "on-surface-variant": "#e0bec4",
            "error": "#ffb4ab",
            "on-primary-fixed-variant": "#8f0042",
            "primary": "#ffb1c3",
            "primary-fixed": "#ffd9e0",
            "on-primary-fixed": "#3f0019",
            "inverse-primary": "#b80f58",
            "surface-container": "#221e27",
            "secondary": "#ddb7ff",
            "on-secondary-fixed": "#2c0051",
            "on-secondary-container": "#d6a9ff",

            "tertiary-fixed": "#ffe08f",
            "on-error-container": "#ffdad6"
          },
          fontFamily: {
            "headline": ["Newsreader", "serif"],
            "body": ["Manrope", "sans-serif"],
            "label": ["Manrope", "sans-serif"],
            "serif": ["Playfair Display", "serif"],
            "sans": ["DM Sans", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
        },
      },
    }

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
    }
    .glass-card {
      background: rgba(60, 55, 65, 0.2);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    .text-gradient-gold {
      background: linear-gradient(to right, #ff4f8b, #eec13c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen selection:bg-primary-container selection:text-on-primary">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-[#15121A]">
<div class="flex items-center gap-4">
<button class="text-[#FF4F8B] active:scale-95 duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-2xl font-serif italic text-[#FF4F8B] tracking-widest uppercase">LoveCheck</h1>
</div>
<div class="flex items-center gap-6">
<span class="text-[#E8E0EC] opacity-70 hover:text-[#FF4F8B] transition-colors duration-300 cursor-pointer">
<span class="material-symbols-outlined">favorite</span>
</span>
<span class="text-[#EEC13C] font-bold active:scale-95 duration-200 cursor-pointer">
<span class="material-symbols-outlined">share</span>
</span>
</div>
<div class="absolute bottom-0 left-0 bg-gradient-to-b from-[#1D1A23] to-transparent h-px w-full"></div>
</header>
<main class="pt-24 pb-32 px-6 max-w-lg mx-auto relative overflow-hidden">
<!-- Ambient Background Glows -->
<div class="absolute top-1/4 -left-20 w-64 h-64 bg-primary-container/10 blur-[100px] rounded-full"></div>
<div class="absolute bottom-1/4 -right-20 w-80 h-80 bg-secondary-container/10 blur-[120px] rounded-full"></div>
<!-- The Shareable Card -->
<section class="relative mb-12">
<div class="glass-card rounded-[2rem] p-10 text-center border border-outline-variant/10 shadow-2xl overflow-hidden group">
<!-- Inner Decorative Glow -->
<div class="absolute -top-20 -right-20 w-40 h-40 bg-tertiary/5 blur-3xl rounded-full"></div>
<div class="mb-2">
<span class="label-md uppercase tracking-[0.2em] text-tertiary/60 font-medium">Compatibility Result</span>
</div>
<!-- The Percentage -->
<div class="relative py-4">
<h2 class="text-9xl font-serif font-black italic text-gradient-gold tracking-tighter leading-none mb-2">
            89%
          </h2>
<div class="absolute -z-10 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-primary-container/20 blur-[60px] rounded-full"></div>
</div>
<!-- The Names -->
<div class="mb-8">
<p class="text-2xl font-serif italic tracking-wide text-on-surface/90">
            Julian + Scarlett
          </p>
</div>
<!-- The Verdict -->
<div class="relative inline-block px-6 py-3">
<div class="absolute inset-0 bg-surface-container-highest/40 rounded-full blur-sm"></div>
<p class="relative text-lg font-serif italic text-tertiary">
            "Endless Champagne Nights"
          </p>
</div>
<!-- Subtle Card Brand Watermark -->
<div class="mt-12 flex justify-center items-center gap-2 opacity-30">
<span class="material-symbols-outlined text-sm">auto_awesome</span>
<span class="text-[10px] uppercase tracking-[0.3em]">LoveCheck Luxury</span>
</div>
</div>
</section>
<!-- Share Actions Grid -->
<section class="space-y-10">
<div class="text-center">
<h3 class="font-serif italic text-xl mb-6">Share Your Sparkle</h3>
<div class="grid grid-cols-1 gap-4">
<!-- Instagram -->
<button class="w-full flex items-center justify-between bg-gradient-to-r from-[#FF4F8B] to-[#6F00BE] text-on-primary rounded-xl px-6 py-4 group active:scale-[0.98] transition-all">
<span class="font-bold tracking-wide">Instagram Story</span>
<span class="material-symbols-outlined">add_a_photo</span>
</button>
<!-- Twitter / X -->
<button class="w-full flex items-center justify-between bg-surface-container-lowest text-on-surface border border-outline-variant/20 rounded-xl px-6 py-4 group active:scale-[0.98] transition-all">
<span class="font-bold tracking-wide">Twitter / X</span>
<span class="material-symbols-outlined">unfold_more</span>
</button>
<!-- WhatsApp -->
<button class="w-full flex items-center justify-between bg-gradient-to-r from-[#00A884]/80 to-[#6F00BE]/80 text-on-surface rounded-xl px-6 py-4 group active:scale-[0.98] transition-all">
<span class="font-bold tracking-wide">WhatsApp</span>
<span class="material-symbols-outlined">send</span>
</button>
</div>
</div>
<!-- Download Action -->
<div class="pt-4">
<button class="w-full flex items-center justify-center gap-3 py-5 border-b border-outline-variant/30 text-tertiary uppercase tracking-widest text-sm font-bold hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">download</span>
<span>Download Card</span>
</button>
</div>
</section>
<!-- Experience Image Background -->
<div class="mt-16 rounded-3xl overflow-hidden aspect-[16/9] relative group">
<img alt="romantic setting" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" data-alt="cinematic close-up of two champagne flutes clinking against a blurry backdrop of city lights at night with purple and pink bokeh" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxp6q8rmc5re5pwZdYegb7srDkPdEp-UqfcG-xdXp5Fvo0pZlS6gd3jdEAV-wSfWHTWuCG-dWBG1fNdjCDHh1sLWT1hASkFRqZn1h63XX98Zt9YyDy0tK3Zq7K1J8NR1-VIVLhXnMV49PVSBoIY3kIf2TBJ8LTwOsUM5aKdaegqIegcMN5Q3iGTEMXCb04jyZoDba5sENF0gRhkCwWtH1kiGjjEUEqouB8h7432BuNMJTPaGHkNSvIBiW5BURL4_ZT5PsRvtYVP8I"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface via-transparent to-transparent"></div>
<div class="absolute bottom-4 left-6">
<p class="font-serif italic text-white/80">Tonight's forecast: High compatibility.</p>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-[#15121A]/80 backdrop-blur-xl rounded-t-3xl border-t border-[#594045]/15 shadow-[0_-10px_40px_rgba(111,0,190,0.15)]">
<a class="flex flex-col items-center justify-center text-[#E8E0EC]/50 p-3 hover:text-[#FF4F8B] hover:bg-[#37333C]/50 transition-all active:scale-90 duration-300" href="#">
<span class="material-symbols-outlined">favorite</span>
</a>
<a class="flex flex-col items-center justify-center text-[#E8E0EC]/50 p-3 hover:text-[#FF4F8B] hover:bg-[#37333C]/50 transition-all active:scale-90 duration-300" href="#">
<span class="material-symbols-outlined">auto_awesome</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#FF4F8B] text-[#66002D] rounded-full p-3 shadow-[0_0_15px_rgba(255,79,139,0.4)] active:scale-90 duration-300" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">share</span>
</a>
<a class="flex flex-col items-center justify-center text-[#E8E0EC]/50 p-3 hover:text-[#FF4F8B] hover:bg-[#37333C]/50 transition-all active:scale-90 duration-300" href="#">
<span class="material-symbols-outlined">person</span>
</a>
</nav>
</body></html>
